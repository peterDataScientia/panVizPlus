[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panvizplus"
version = "0.3.0a0"
description = "RDKit-powered native provenance-aware protein-ligand interaction analysis and 2D visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "rdkit==2026.3.6",
]

[project.scripts]
panvizplus = "panvizplus.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["panvizplus*"]

[tool.setuptools.package-data]
"panvizplus.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
