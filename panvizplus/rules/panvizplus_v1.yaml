metadata:
  id: panvizplus_v1
  version: 0.2.0-alpha
  status: alpha
  exact_biovia_reproduction: false
  scientific_position: >
    Native panVizPlus interaction rules. The engine uses explicit, inspectable
    criteria and does not claim exact reproduction of proprietary implementations.
    Each interaction class exposes explicit chemical and geometric criteria.
  units:
    distance: angstrom
    angle: degree

interactions:
  conventional_hbond:
    status: alpha
    chemistry:
      from_site: hydrogen_donor
      to_site: hydrogen_acceptor
    geometry:
      donor_acceptor_distance_max: 3.4
      dha_angle_min: 90.0
      hay_angle_min: 90.0
      xda_angle_min: 90.0
      day_angle_min: 90.0
    confidence: provisional_numeric_thresholds

  hydrophobic_contact:
    status: alpha
    chemistry:
      ligand_elements: [C, S]
      protein_sidechain_template: true
    geometry:
      atom_distance_max: 4.5
    confidence: moderate

  salt_bridge:
    status: alpha
    chemistry:
      opposite_charge_required: true
    geometry:
      charge_center_distance_max: 4.0
    confidence: moderate

  pi_pi:
    status: alpha
    chemistry:
      two_planar_ring_systems_required: true
    common_geometry:
      center_distance_max: 6.0
      closest_atom_distance_max: 4.5
    stacked:
      plane_angle_max: 30.0
    t_shaped:
      plane_angle_min: 60.0
    confidence: moderate

  pi_cation:
    status: alpha
    chemistry:
      pi_system_required: true
      positive_site_required: true
    geometry:
      center_distance_max: 5.0
    confidence: moderate

  halogen_bond:
    status: alpha
    chemistry:
      ligand_halogen: [Cl, Br, I]
      acceptor_elements: [N, O, S]
    geometry:
      vdw_sum_scale_max: 1.0
      C_X_A_angle_min: 150.0
    confidence: moderate

  metal_coordination:
    status: alpha
    chemistry:
      ligand_donor_elements: [N, O, S]
      protein_donor_elements: [N, O, S]
    geometry:
      distance_max: 2.8
    confidence: moderate

  water_bridge:
    status: alpha
    chemistry:
      water_oxygen_required: true
      donor_acceptor_features_required: true
    geometry:
      heavy_atom_distance_max: 3.5
    confidence: moderate

  unfavorable_vdw_bump:
    status: alpha
    geometry:
      fraction_sum_vdw_radii_min: 0.70
      interpretation: >
        Atom pairs closer than this fraction of the sum of van der Waals radii
        are flagged as unfavorable steric contacts.
    confidence: moderate

references:
  - id: panvizplus_native_rule_registry
    kind: internal_open_specification
    note: >
      Numeric thresholds are explicit, versioned, and benchmarkable. They are
      research defaults rather than claims of exact proprietary-tool defaults.
