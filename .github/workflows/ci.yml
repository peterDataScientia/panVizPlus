name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - name: Reject removed detector dependency
        run: |
          if grep -Rin --exclude-dir=.git --exclude='*.md' --exclude='ci.yml' 'plip' .; then
            echo "Removed detector dependency/reference found in production source."
            exit 1
          fi
      - run: python -m compileall -q app.py panvizplus
      - run: which obabel && obabel -V
      - run: pytest -q
      - name: Streamlit boot smoke test
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/panvizplus.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panvizplus.log
          exit 1
